# Cmd-style shortcuts, to match macOS Terminal.
#
# Hyprland binds SUPER+c/v/t/w/n and, when a terminal is focused, forwards the
# original keypress here rather than translating it to Ctrl+<key>. That matters:
# translating would send Ctrl+C, which is SIGINT and would kill whatever is
# running. Ctrl+C therefore keeps its normal meaning below.
#
# kitty treats `cmd` as an alias for `super` on every platform, so either
# spelling works; `super` is used here to match the Hyprland side.

map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+t new_tab
map super+w close_tab
map super+n new_os_window

# Tab navigation, as on macOS.
map super+shift+bracketleft  previous_tab
map super+shift+bracketright next_tab

# Ctrl+Shift+C/V still work as the Linux defaults.


# ── Nocturne theming ────────────────────────────────────────────────────────
# Font: the JetBrainsMono Nerd Font that's already installed system-wide.
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0
# keep ligatures, but not under the cursor
disable_ligatures cursor
modify_font cell_height 105%

# Window — translucent so Hyprland's blur shows through (matches the desktop glass).
background_opacity   0.92
window_padding_width 10 12
hide_window_decorations yes
confirm_os_window_close 0
window_margin_width 0

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
# subtle cursor trail (kitty >= 0.36)
cursor_trail          3

# Scrollback / mouse / bell
scrollback_lines 10000
mouse_hide_wait  2.0
url_style        curly
copy_on_select   yes
enable_audio_bell no

# Colors + tab bar from DMS matugen (regenerated on every wallpaper change).
include dank-theme.conf
include dank-tabs.conf
