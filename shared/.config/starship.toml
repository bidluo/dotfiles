"$schema" = 'https://starship.rs/config-schema.json'

# Colours use ANSI names (blue/cyan/green/purple/…) so the prompt tracks the
# terminal's 16-colour matugen palette automatically.

format = """
$directory\
$git_branch\
$git_status\
$fill\
$c$rust$python$nodejs$golang$lua\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[fill]
symbol = " "

[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = "  "
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[cmd_duration]
min_time = 2000
style = "dimmed yellow"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[c]
symbol = " "
style = "blue"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "red"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version )]($style)"
