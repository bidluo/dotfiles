[main]
font=JetBrainsMono Nerd Font:size=13
use-bold=yes
dpi-aware=no
prompt="  "
icon-theme=Adwaita
fields=name,generic
terminal=kitty -e
layer=overlay
lines=10
width=42
horizontal-pad=28
vertical-pad=22
inner-pad=16
line-height=30
image-size-ratio=0.85
exit-on-keyboard-focus-loss=yes

[colors]
background=181818f2
text=c8c8c8ff
prompt=33ccffff
placeholder=6a6a6aff
input=eeeeeeff
match=33ccffff
selection=2b3540ff
selection-text=ffffffff
selection-match=00ff99ff
counter=6a6a6aff
border=33ccffcc

[border]
width=2
radius=14
