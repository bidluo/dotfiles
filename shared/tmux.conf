set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
# Vesper palette, to match Ghostty (peach is the main accent, so it stands in
# for mauve). The plugin only sets @thm_* colours that are unset, so these win.
# Delete this block for stock Frappe.
set -g @thm_bg "#101010"
set -g @thm_fg "#ffffff"
set -g @thm_rosewater "#ffffff"
set -g @thm_flamingo "#f5a191"
set -g @thm_pink "#e29eca"
set -g @thm_mauve "#ffc799"
set -g @thm_red "#ff8080"
set -g @thm_maroon "#f5a191"
set -g @thm_peach "#ffc799"
set -g @thm_yellow "#e6b99d"
set -g @thm_green "#90b99f"
set -g @thm_teal "#99ffe4"
set -g @thm_sky "#99ffe4"
set -g @thm_sapphire "#b9aeda"
set -g @thm_blue "#aca1cf"
set -g @thm_lavender "#b9aeda"
set -g @thm_subtext_1 "#c0c0c0"
set -g @thm_subtext_0 "#a0a0a0"
set -g @thm_overlay_2 "#8b8b8b"
set -g @thm_overlay_1 "#7e7e7e"
set -g @thm_overlay_0 "#5c5c5c"
set -g @thm_surface_2 "#3a3a3a"
set -g @thm_surface_1 "#282828"
set -g @thm_surface_0 "#1c1c1c"
set -g @thm_mantle "#161616"
set -g @thm_crust "#0a0a0a"
set -g @catppuccin_window_status_style "rounded"
# Pane title capped at 20 chars (Claude session titles run long), plus
# Claude Code's state flag (set by ~/.claude/scripts/tmux-flag.sh)
set -g @catppuccin_window_text " #{=/20/…:pane_title}#{?@claude, #{@claude},}"
set -g @catppuccin_window_current_text " #{=/20/…:pane_title}#{?@claude, #{@claude},}"

#set -g @resurrect-capture-pane-contents 'on'
#set -g @copy_use_osc52_fallback on
#set -g @continuum-restore 'on'
#set -g @continuum-save-interval '1'
#set -g @resurrect-strategy-nvim 'session'

run ~/.tmux/plugins/tmux/catppuccin.tmux

# PATH comes from the shell that starts tmux; fish sets it up.
set -g default-command fish

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:extkeys'
set -g extended-keys on

# Flag windows that ring the bell (Claude Code hooks, long fish commands)
set -g monitor-bell on
set -g bell-action other

set -g base-index 1
set -sg repeat-time 500
set -sg escape-time 0

set -g set-titles on
set -g allow-rename off
set -g set-titles-string "#I:#W"
set -g renumber-windows on

#set -g terminal-overrides 'xterm*:smcup@:rmcup@'

setw -g mode-keys vi
setw -g automatic-rename on

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Change prefix key
set -g prefix C-a
bind-key C-a send-prefix
unbind-key C-b
unbind-key C-d
unbind-key C-Z

# New windows open in the current pane's directory
bind c new-window -c '#{pane_current_path}'

# Rename window
bind X command-prompt -I "#{window_name}" "rename-window '%%'"

# Reload tmux configuration 
bind R source-file ~/.tmux.conf \; display "Config reloaded";

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h if-shell "$is_vim" \
  "send-keys C-h" \
  "select-pane -L"

bind -n C-j if-shell "$is_vim" \
  "send-keys C-j" \
  "if-shell \"$is_fzf\" \"send-keys C-j\" \"select-pane -D\""

bind -n C-k if-shell "$is_vim" \
  "send-keys C-k" \
  "if-shell \"$is_fzf\" \"send-keys C-k\" \"select-pane -U\""

bind -n C-l if-shell "$is_vim" \
  "send-keys C-l" \
  "select-pane -R"

bind -n C-\\ if-shell "$is_vim" \
  "send-keys C-\\" \
  "select-pane -l"

# Copy/Paste
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# Copies go to the system clipboard via OSC 52 (works over SSH too), and
# through copy-command where one is set (pbcopy on macOS).
set -s set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Resizing
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# split panes using | and -
bind ! split-window -h -c '#{pane_current_path}'
bind @ split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Claude Code
bind C new-window -c '#{pane_current_path}' -n claude claude
# Pick from only the windows where Claude is waiting or done
bind a choose-tree -Zw -f '#{@claude}'
# Ask Claude about the last 200 lines of this pane
bind A display-popup -E -w 80% -h 80% -b rounded -S 'fg=#ffc799' -s 'bg=#101010' \
  -T '#[fg=#101010,bg=#ffc799,bold]  ask claude #[default]' "$HOME/.claude/scripts/tmux-ask.sh"
# Quick question: interactive Claude floating over the current pane
bind Q display-popup -E -w 75% -h 75% -b rounded -S 'fg=#99ffe4' -s 'bg=#101010' \
  -d '#{pane_current_path}' -T '#[fg=#101010,bg=#99ffe4,bold]  quick claude #[default]' claude
# A finished (✓) flag clears once you look at the window
set-hook -g session-window-changed 'if -F "#{==:#{@claude},✓}" "set -wu @claude"'
set-hook -g client-session-changed 'if -F "#{==:#{@claude},✓}" "set -wu @claude"'

if-shell '[ "$(uname)" = Darwin ]' \
  'source-file ~/.tmux.conf.macos'

# Styling
run -b '~/.tmux/plugins/tpm/tpm'
