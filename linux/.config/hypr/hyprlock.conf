# Background stays on every output (empty monitor = all) — an uncovered screen
# would defeat the lock. Only the widgets below are pinned to one display.
background {
    monitor =
    path    = /home/david/Pictures/Wallpapers/wallpaper.jpg
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
}

input-field {
    monitor        =
    size           = 300, 50
    outline_thickness = 2
    dots_size      = 0.25
    dots_spacing   = 0.3
    dots_center    = true
    outer_color    = rgba(33ccffee)
    inner_color    = rgba(1a1a1acc)
    font_color     = rgb(eeeeee)
    fade_on_empty  = false
    placeholder_text = <i>Password…</i>
    hide_input     = false
    check_color    = rgba(00ff99ee)
    fail_color     = rgba(ff5555ee)
    fail_text      = <i>Wrong</i>
    position       = 0, -40
    halign         = center
    valign         = center
}

label {
    monitor   =
    text      = cmd[update:1000] echo "$(date +'%H:%M')"
    color     = rgba(eeeeeeff)
    font_size = 92
    font_family = sans-serif
    position  = 0, 200
    halign    = center
    valign    = center
}

label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color     = rgba(eeeeeeaa)
    font_size = 20
    font_family = sans-serif
    position  = 0, 120
    halign    = center
    valign    = center
}
