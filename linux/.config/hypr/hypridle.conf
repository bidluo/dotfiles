# NO lock_cmd here, deliberately. DMS (loginctlLockIntegration) already answers
# the logind Lock signal with its own quickshell lock screen. A lock_cmd that
# launched hyprlock made BOTH of them race for ext_session_lock_v1 — only one
# client may hold it, the loser gets `finished`, and hyprlock 0.9.5 segfaults on
# that exit path (coredump 2026-08-15 10:18:55). When the client that HELD the
# lock is the one that dies, the compositor stays locked with a black screen and
# no way to type a password — a hard reset. DMS is the single lock client now;
# everything below just emits `loginctl lock-session` and lets it respond.
general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Dim the backlight after 5 minutes
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock after 10 minutes
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# Screens off after 15 minutes.
# on-resume is the wake handler (fires on any input) — its absence is what made
# the earlier manual bind strand the session. Wake-on-input verified working
# 2026-07. If DPMS ever wakes unreliably again, the manual Cmd+Ctrl+Shift+Q
# path has an independent watchdog; this idle path relies on on-resume.
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
